name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate-core:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 版本号五处一致性
        run: node tools/bump.mjs --check
      - name: 回归测试
        run: npm test
